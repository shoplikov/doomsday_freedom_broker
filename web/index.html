<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA · Качество диалогов</title>
  <script>
    // Theme before first paint: the user's choice, else the system setting.
    (() => {
      let t = null;
      try { t = localStorage.getItem("cqa-theme"); } catch {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts are optional: offline the UI falls back to system fonts. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap&subset=cyrillic">
  <link rel="stylesheet" href="styles.css">
  <!-- Dynamics 365: set window.CQA_API_BASE before app.js if the API lives on another origin. -->
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/dialogs" aria-label="CQA, к списку диалогов">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h2.5l2-5 3.5 10 2.5-7 1.5 2H20"/></svg>
      </span>
      <span>CQA<small>Качество диалогов</small></span>
    </a>
    <nav aria-label="Разделы">
      <a href="#/dialogs" data-page="dialogs">Диалоги</a>
      <a href="#/review" data-page="review">Проверка <span class="nav-count" id="queue-count" hidden></span></a>
      <a href="#/checklist" data-page="checklist">Чек-лист</a>
      <a href="#/analytics" data-page="analytics">Аналитика</a>
    </nav>
    <div class="header-right">
      <span id="health" class="health">Модели…</span>
      <div class="role-switch">
        <span>Роль</span>
        <div class="seg" role="group" aria-label="Роль">
          <button type="button" data-role="operator" title="Видит оценки и может оспорить критерий">Оператор</button>
          <button type="button" data-role="reviewer" title="Решает апелляции и спорные вердикты">Проверяющий</button>
        </div>
      </div>
      <button type="button" class="icon ghost" id="theme" aria-label="Сменить тему" title="Светлая или тёмная тема">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
