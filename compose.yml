# One file for both environments. The project name comes from the folder:
#   /opt/doomsday_freedom_broker      (main) -> port 80
#   /opt/doomsday_freedom_broker-dev  (dev)  -> port 8080 (CI passes APP_PORT)
# Each gets its own container, image and cqa-state volume.
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_PORT:-80}:8000"
    volumes:
      - cqa-state:/app/state

volumes:
  cqa-state:
